<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MOBA Kuis Drama 2D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
    <!-- LAYAR LOGIN -->
    <div id="login-screen">
        <h2>⚔️ MOBA DRAMA 2D ⚔️</h2>
        <p class="subtitle">Gerakkan Hero & Hancurkan Turret Musuh!</p>
        <input type="text" id="nama" placeholder="Nama Lengkap" required>
        <input type="text" id="kelas" placeholder="Kelas" required>
        <button onclick="startGame()">MASUK ARENA</button>
    </div>

    <!-- ARENA GAME -->
    <div id="game-screen" class="hidden">
        <canvas id="gameCanvas" width="360" height="400"></canvas>

        <div id="controls">
            <div id="joystick-zone">
                <div id="joystick-base">
                    <div id="joystick-stick"></div>
                </div>
            </div>
            <div id="action-zone">
                <button id="btn-attack" onclick="bukaSoal()">🔥 SKILL</button>
            </div>
        </div>
    </div>

    <!-- MODAL KUIS -->
    <div id="quiz-modal" class="modal">
        <div class="modal-content">
            <span class="badge" id="kategori-soal">Materi Drama</span>
            <h4 id="soal-text">Pertanyaan...</h4>
            <div id="opsi-container"></div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
