<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOBA Edukasi: Arena Bahasa & Drama</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
    <!-- LAYAR UTAMA / LOGIN -->
    <div id="login-screen">
        <h2>⚔️ MOBA EDUKASI DRAMA ⚔️</h2>
        <p class="subtitle">Kuasai Unsur & Aturan Penulisan Drama untuk Menghancurkan Turret Musuh!</p>
        <input type="text" id="nama" placeholder="Nama Lengkap" required>
        <input type="text" id="kelas" placeholder="Kelas" required>
        <button onclick="startGame()">MASUK ARENA</button>
    </div>

    <!-- ARENA PERTANDINGAN -->
    <div id="game-screen" class="hidden">
        <h3>⚔️ Pertarungan 1v1 Arena ⚔️</h3>
        
        <div class="health-container">
            <strong>🛡️ Hero Kamu (HP: <span id="player-hp-text">100</span>)</strong>
            <div class="health-bar"><div id="player-hp" class="health-fill"></div></div>
        </div>

        <div class="health-container">
            <strong>🏰 Turret Musuh (HP: <span id="enemy-hp-text">100</span>)</strong>
            <div class="health-bar"><div id="enemy-hp" class="health-fill"></div></div>
        </div>

        <div class="score-board">
            Skor Sementara: <strong id="score-text">0</strong>
        </div>

        <button class="btn-attack" onclick="bukaSoal()">🔥 SERANG / LUNCURKAN SKILL 🔥</button>
    </div>

    <!-- POP-UP KUIS DRAMA -->
    <div id="quiz-modal" class="modal hidden">
        <div class="modal-content">
            <span class="badge" id="kategori-soal">Materi Drama</span>
            <h4 id="soal-text">Pertanyaan...</h4>
            <div id="opsi-container"></div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
